<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Not Verify: Interlocking double-chevron mark -->
  <!-- Back chevron (left arrow) -->
  <polygon points="10,10 10,110 60,60" fill="#00BFFF"/>
  <!-- Cutout for back chevron -->
  <polygon points="22,26 22,94 52,60" fill="#0f1628"/>
  <!-- Front chevron (right arrow) -->
  <polygon points="50,10 50,110 100,60" fill="#00BFFF"/>
  <!-- Cutout for front chevron -->
  <polygon points="62,26 62,94 92,60" fill="#0f1628"/>
  <!-- Interlocking bridge: back arrow's right edge passes through front arrow -->
  <polygon points="50,10 50,35 32,60 50,85 50,110 10,66 35,60 10,54" fill="#00BFFF"/>
  <polygon points="50,30 50,42 40,60 50,78 50,90 25,60" fill="#0f1628"/>
</svg>
